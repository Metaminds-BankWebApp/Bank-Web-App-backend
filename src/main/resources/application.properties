spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Render provides PORT at runtime; use 8080 for local development and Docker.
server.port=${PORT:8080}
# Comma-separated exact browser origins. Set APP_CORS_ALLOWED_ORIGINS on Render.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.support.retention.days=30
app.support.retention.cleanup-cron=0 15 3 * * *
app.support.retention.time-zone=Asia/Colombo
app.support.retention.scheduling-enabled=true
